    <meta name="theme-color" content="#25160e" />
    <meta name="description" content="Brew & Bloom — Crafted with passion, served with love. Scan QR to order." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="manifest" href="/manifest.json" />
    <title>Brew & Bloom — QR Menu</title>
    <!-- Tailwind CDN with design system (matches provided templates) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    fontFamily: {
                        "caption": ["Inter"],
                        "label-md": ["Inter"],

        .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }

        .shadow-level-2 { box-shadow: 0 8px 24px rgba(60,42,33,0.12); }
        .shadow-ambient-1 { box-shadow: 0 4px 12px rgba(60,42,33,0.08); }
        .shadow-umbra-1 { box-shadow: 0 4px 12px rgba(60,42,33,0.08); }
        .otp-input:focus { outline: none; border-color: #D4613C; box-shadow: 0 0 0 1px #D4613C; }
